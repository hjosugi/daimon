version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "api"
    commit-message:
      prefix: "chore(api)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Every uv update re-locks the spaCy model wheels pinned by URL in
  # ml-service/pyproject.toml; see the [[tool.uv.dependency-metadata]] note
  # there for why they carry static metadata.
  - package-ecosystem: "uv"
    directory: "/ml-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ml"
    commit-message:
      prefix: "chore(ml)"
      include: "scope"
    # The two spaCy models are pinned by URL to their GitHub release assets and
    # are not published on PyPI. Dependabot looks the names up on PyPI anyway and
    # finds only a dependency-confusion stub for ja-core-news-sm (999.9.9), which
    # it proposes as a major update that `uv lock` cannot satisfy. Bump the models
    # by hand together with spaCy, and keep their dependency-metadata in
    # ml-service/pyproject.toml in step.
    ignore:
      - dependency-name: "ja-core-news-sm"
      - dependency-name: "en-core-web-sm"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
      - "api"
    commit-message:
      prefix: "chore(api-docker)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/ml-service"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
      - "ml"
    commit-message:
      prefix: "chore(ml-docker)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
