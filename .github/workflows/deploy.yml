name: Deploy to Cloud Run via Cloud Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  SERVICE_NAME: daimon-backend
  REPO: daimon

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Submit build to Cloud Build
        run: |
          gcloud builds submit \
            --config=backend/cloudbuild.yaml \
            --substitutions=_REGION=${REGION},_REPO=${REPO},_QDRANT_URL="${{ secrets.QDRANT_URL }}",_CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
            --region=${REGION} \
            backend

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Service URL: https://${SERVICE_NAME}-$(echo ${PROJECT_ID} | cut -d'-' -f1)-${REGION}.a.run.app"
