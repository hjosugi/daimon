name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daimon
          POSTGRES_PASSWORD: daimon
          POSTGRES_DB: daimon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daimon -d daimon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Test
        env:
          DAIMON_TEST_DATABASE_URL: postgresql://daimon:daimon@localhost:5432/daimon_test?sslmode=disable
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build server and batch
        run: |
          go build -o /tmp/daimon-server ./cmd/server
          go build -o /tmp/daimon-batch ./cmd/batch

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  ml:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: ml-service/uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --no-install-project
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Import smoke test
        run: uv run python -c "from app import app, EMBED_DIM, POST_TEXT_MAX_CHARS; assert app.title == 'daimon-ml'; assert EMBED_DIM == 384; assert POST_TEXT_MAX_CHARS == 40000"

  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f compose.yml config >/dev/null
      - name: Validate Cloud Build file shape
        run: |
          test -f cloudbuild.yaml
          grep -q "daimon-api" cloudbuild.yaml
          grep -q "daimon-ml" cloudbuild.yaml
      - name: Validate Vercel SPA rewrite
        run: |
          jq -e '
            any(.rewrites[];
              .source == "/(.*)" and .destination == "/index.html"
            )
          ' vercel.json >/dev/null
      - name: Build API Docker image
        run: docker build --pull -t daimon-api-ci ./api
      - name: Build ML Docker image
        run: docker build --pull -t daimon-ml-ci ./ml-service
      - name: Smoke test ML Docker runtime
        run: >-
          docker run --rm
          --entrypoint /app/.venv/bin/python
          daimon-ml-ci
          -c "from app import app; assert app.title == 'daimon-ml'"
