    "uvicorn[standard]==0.27.0",
    "sentence-transformers==2.3.1",
    "qdrant-client==1.7.0",
    "python-dotenv==1.0.1",
    "pydantic==2.6.0",
    "numpy",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
