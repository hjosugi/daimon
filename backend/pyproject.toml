[project]
name = "daimon-backend"
version = "0.1.0"
description = "Daimon backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.27.0",
    "sentence-transformers==2.3.1",
    "qdrant-client==1.7.0",
    "python-dotenv==1.0.1",
    "pydantic==2.6.0",
    "numpy",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "spacy==3.7.2",
    "bcrypt==4.1.2",
    "alembic==1.13.1",
]

[tool.uv.scripts]
reset-db = "python reset_db.py"
