steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api:latest || true
    dir: 'backend'
    id: 'pull-cache'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DOCKER_BUILDKIT=1 docker build \
          --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api:latest \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api:latest \
          .
    dir: 'backend'
    waitFor: ['pull-cache']
    timeout: '1200s'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api'
    dir: 'backend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'daimon-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/daimon-api:${SHORT_SHA}'
      - '--platform'
      - 'managed'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--startup-cpu-boost'
      - '--set-secrets'
      - 'DATABASE_URL=database-url:latest'
      - '--set-env-vars'
      - 'QDRANT_URL=${_QDRANT_URL},CORS_ORIGINS=${_CORS_ORIGINS}'

substitutions:
  _REGION: 'asia-northeast1'
  _REPO: 'daimon'
  _QDRANT_URL: ''
  _CORS_ORIGINS: 'https://daimon-sandy.vercel.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_STANDARD_4'
  substitution_option: 'ALLOW_LOOSE'
  diskSizeGb: 10
  timeout: '1800s'
