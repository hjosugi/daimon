[project]
license = "0BSD"
name = "daimon-ml-service"
version = "0.1.4"
description = "Daimon text embedding and POV extraction microservice"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Policy: exact pins for API/server packages keep Cloud Run behavior stable.
    # Heavy ML/runtime packages use bounded ranges where ABI compatibility matters.
    # When updating uv.lock, run `uv sync --locked --no-install-project`,
    # `uv run pytest`, and the import smoke test mirrored in CI.
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # sentence-transformers stays pinned because the 384-d embedding contract,
    # chunk pooling behavior, and Qdrant index compatibility depend on this stack.
    "sentence-transformers==6.1.0",
    # Security floors for transitive ML/build dependencies. Transformers 5.5+
    # closes unsafe model-loading paths; setuptools 83 normalizes manifest paths.
    "transformers>=5.5,<6",
    "setuptools>=83",
    "torch>=2.3,<3",
    "spacy>=3.8.15,<3.9.0",
    "typer>=0.27.1",
    "numpy<3",
    "ja-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_sm-3.8.0/ja_core_news_sm-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Static metadata for the two spaCy model wheels pinned by URL above.
#
# Dependabot runs `uv lock` behind a proxy that adds the job's GitHub credential
# to every github.com request. For a direct-URL wheel uv first sends a HEAD
# request to read the wheel metadata over HTTP range requests; with that
# credential GitHub redirects the HEAD to a signed URL that answers 401, and uv
# does not fall back to a plain download on 401. Every Dependabot update for this
# directory then fails with private_source_authentication_failure
# (dependabot/dependabot-core#16790). Declaring the metadata here means uv never
# probes the wheels. The URLs, versions and hashes in uv.lock are unchanged.
#
# Keep each entry identical to the wheel's own METADATA (Requires-Dist) and
# change it together with the URL and version in `dependencies`.
[[tool.uv.dependency-metadata]]
name = "ja-core-news-sm"
version = "3.8.0"
requires-dist = ["sudachipy>=0.5.2,!=0.6.1", "sudachidict-core>=20211220"]

[[tool.uv.dependency-metadata]]
name = "en-core-web-sm"
version = "3.8.0"
requires-dist = []

[dependency-groups]
dev = [
    # Keep TestClient on the httpx line validated with the pinned FastAPI stack.
    "httpx<0.29",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
