# Cloud Build deploys the production Go API and Python ML service to Cloud Run.
#
# Expected Cloud Build trigger substitutions:
#   _QDRANT_URL     Required. Qdrant Cloud URL, e.g. https://...:6333
#   _CORS_ORIGINS   Required for browser callers. Defaults to the current Vercel URL.
#
# Expected Secret Manager secrets:
#   database-url     Supabase/Postgres connection string used by the API
#   qdrant-api-key   Qdrant Cloud API key used by the API
#
# Expected Artifact Registry repo:
#   ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}

substitutions:
  _REGION: asia-northeast1
  _AR_REPO: daimon
  _API_SERVICE: daimon-api
  _ML_SERVICE: daimon-ml
  _QDRANT_URL: REQUIRED_QDRANT_URL
  _CORS_ORIGINS: https://daimon-sandy.vercel.app
  _API_CPU: "1"
  _API_MEMORY: 512Mi
  _API_MAX_INSTANCES: "5"
  _ML_CPU: "2"
  _ML_MEMORY: 2Gi
  _ML_MAX_INSTANCES: "3"
  _ML_INGRESS: internal

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: validate-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${_QDRANT_URL}" != "REQUIRED_QDRANT_URL" || {
          echo "Missing required Cloud Build substitution: _QDRANT_URL" >&2
          exit 1
        }
        test -n "${_CORS_ORIGINS}" || {
          echo "Missing required Cloud Build substitution: _CORS_ORIGINS" >&2
          exit 1
        }

  - id: build-ml
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-ml"
        docker pull "${IMAGE}:latest" || true
        docker build \
          --cache-from "${IMAGE}:latest" \
          -t "${IMAGE}:$SHORT_SHA" \
          -t "${IMAGE}:latest" \
          ml-service

  - id: push-ml
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-ml"
        docker push "${IMAGE}:$SHORT_SHA"
        docker push "${IMAGE}:latest"

  - id: deploy-ml
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ML_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-ml:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8001
      - --cpu=${_ML_CPU}
      - --memory=${_ML_MEMORY}
      - --max-instances=${_ML_MAX_INSTANCES}
      - --ingress=${_ML_INGRESS}
      - --allow-unauthenticated
      - --cpu-boost
      - --set-env-vars=PORT=8001

  - id: capture-ml-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe "${_ML_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)' > /workspace/ml-url.txt
        test -s /workspace/ml-url.txt
        echo "ML service URL: $(cat /workspace/ml-url.txt)"

  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-api"
        docker pull "${IMAGE}:latest" || true
        docker build \
          --cache-from "${IMAGE}:latest" \
          -t "${IMAGE}:$SHORT_SHA" \
          -t "${IMAGE}:latest" \
          api

  - id: push-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-api"
        docker push "${IMAGE}:$SHORT_SHA"
        docker push "${IMAGE}:latest"

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        ML_URL="$(cat /workspace/ml-url.txt)"
        gcloud run deploy "${_API_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-api:$SHORT_SHA" \
          --region="${_REGION}" \
          --platform=managed \
          --port=8000 \
          --cpu="${_API_CPU}" \
          --memory="${_API_MEMORY}" \
          --max-instances="${_API_MAX_INSTANCES}" \
          --ingress=all \
          --allow-unauthenticated \
          --cpu-boost \
          --set-env-vars="^|^PORT=8000|QDRANT_URL=${_QDRANT_URL}|EMBED_URL=${ML_URL}|CORS_ORIGINS=${_CORS_ORIGINS}" \
          --set-secrets="DATABASE_URL=database-url:latest,QDRANT_API_KEY=qdrant-api-key:latest"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-api:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-ml:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/daimon-ml:latest
