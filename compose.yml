services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  db:
    image: docker.io/library/postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: daimon
      POSTGRES_PASSWORD: daimon
      POSTGRES_DB: daimon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daimon -d daimon"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # Python ML microservice — the ONLY Python in the running stack.
  ml:
    build: ./ml-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
    restart: unless-stopped

  # Go API — everything except ML.
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://daimon:daimon@db:5432/daimon
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBED_URL: http://ml:8001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ml:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
