services:
  db:
    image: docker.io/library/postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: daimon
      POSTGRES_PASSWORD: daimon
      POSTGRES_DB: daimon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daimon -d daimon"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Python ML microservice — the ONLY Python in the running stack.
  ml:
    build: ./ml-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Go API — everything except ML.
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://daimon:daimon@db:5432/daimon
      EMBED_URL: http://ml:8001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
