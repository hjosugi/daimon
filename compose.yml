services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  db:
    image: docker.io/library/postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: daimon
      POSTGRES_PASSWORD: daimon
      POSTGRES_DB: daimon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  qdrant_storage:
  postgres_data:
